# Bundle self-activation patch. `dsh plugin --profile web add` picks this up
# via package.json `dsh.bundle.patch`. The client half needs no row of its
# own — dsh-client-modules scans every live loader entry for a `dsh.client`
# declaration and serves the ./client export.
- insert:
    - id: oauth-subs
      name: dsh-subscription-monitor
      config:
        port: 8318
        provider: oauth
        grokLogin: device
