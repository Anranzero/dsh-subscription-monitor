<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Subscription usage">
  <defs>
    <linearGradient id="osubs-tile" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4C77FF"/>
      <stop offset="1" stop-color="#1B3BB8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#osubs-tile)"/>
  <!-- One bold subject: a usage ring. The dim track is the allowance, the bright
       arc is what has been consumed, so the mark still says "how much is used"
       in a 20px plugin row. No thin decoration. -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="7"/>
  <path d="M32 15a17 17 0 0 1 0 34" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="4.5" fill="#FFFFFF"/>
</svg>
